name: Buscar podcasts nuevos

on:
  # Una sola línea, cada dos horas, en el minuto 17.
  #
  # Por qué así, que tiene su historia. Al principio pedíamos horas concretas
  # (las 00:07 de España, etc.) y encima dobladas, porque los horarios de GitHub
  # van en UTC y no cambian con el horario de verano. No funcionó: GitHub no te
  # da una cita, te mete en una cola, y medido en este mismo repositorio los
  # retrasos iban de 1 h 35 a más de 4 horas. Además, de las diez horas que
  # pedíamos solo lanzaba cinco.
  #
  # Así que dejamos de pelearnos con la hora exacta. Con una pasada cada dos
  # horas da igual que GitHub llegue tarde y da igual el horario de verano:
  # nunca pasamos mucho rato sin mirar, suba el episodio a la hora que suba.
  # (El 3 de septiembre de 2026 un Marcianos subió a media mañana en vez de a
  # las 00:03, cayó en un agujero de trece horas y tardó todo el día en salir.
  # Esto es para que eso no vuelva a pasar.)
  #
  # El minuto 17 no es capricho: en los minutos redondos (:00, :15, :30) es
  # cuando todo el mundo ha programado lo suyo y la cola se alarga.
  #
  # Son 12 ejecuciones al día. Repositorio público = minutos gratis.
  schedule:
    - cron: '17 */2 * * *'

  # Este botón permite lanzarlo a mano desde la pestaña Actions de GitHub.
  workflow_dispatch:
    inputs:
      modo:
        description: 'Qué hacer'
        required: true
        default: 'normal'
        type: choice
        options:
          - normal   # comportamiento de siempre
          - seco     # mira las webs y enseña qué haría, sin publicar nada
          - prueba   # manda un mensaje de mentira para comprobar Telegram
          - estreno  # solo el día que abres el canal: publica el último de cada uno

# Evita que dos ejecuciones se pisen si una tarda mucho.
concurrency:
  group: buscar-podcasts
  cancel-in-progress: false

jobs:
  buscar:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # necesario para guardar estado.json en el repositorio

    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      - name: Preparar Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Instalar lo que necesita el programa
        run: pip install -r requirements.txt

      - name: Comprobar que el bot no está roto
        run: python pruebas.py

      - name: Buscar podcasts
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CANAL: ${{ secrets.TELEGRAM_CANAL }}
          TELEGRAM_CANAL_CHAT: ${{ secrets.TELEGRAM_CANAL_CHAT }}
        run: |
          case "${{ github.event.inputs.modo }}" in
            seco)    python main.py --seco ;;
            prueba)  python main.py --prueba ;;
            estreno) python main.py --estreno ;;
            *)       python main.py ;;
          esac

      - name: Guardar por dónde vamos
        run: |
          if [ -n "$(git status --porcelain estado.json)" ]; then
            git config user.name  "Bot Marciano"
            git config user.email "actions@github.com"
            git add estado.json
            git commit -m "Actualizar episodios ya avisados"
            git push
          else
            echo "Sin cambios en estado.json"
          fi
