name: Buscar podcasts nuevos

on:
  # OJO: los horarios de GitHub van en hora UTC y NO cambian con el horario de
  # verano. España es UTC+2 en verano y UTC+1 en invierno, así que cada hora que
  # queremos aquí aparece DOS veces, una para cada mitad del año. La que no toca
  # se ejecuta una hora antes o después: mira, no ve nada nuevo y se calla.
  #
  # Y otra cosa importante: la hora que pides NO es la hora a la que se ejecuta.
  # GitHub te mete en una cola y te atiende cuando puede. Medido en este mismo
  # repositorio: entre 17 y 32 minutos tarde, siempre. Por eso los minutos son
  # raros (:07 y :53 en vez de :00 o :15): cuanto menos redondo es el minuto,
  # menos gente hay pidiendo turno y menos se alarga la cola.
  #
  # En hora de España, esto es lo que pedimos:
  #
  #   00:07  →  los episodios salen a las 00:03. Esta es la buena.
  #   00:53  →  repesca, por si la primera se quedó atascada en la cola.
  #   01:43  →  última red de seguridad de la noche.
  #   12:07  →  el Aftershow a veces sale a mediodía.
  #   12:53  →  repesca del mediodía.
  #
  # Son 10 ejecuciones al día. En un repositorio público los minutos son
  # gratis e ilimitados, así que da igual.
  schedule:
    - cron: '7 22,23 * * *'    # las 00:07 de España
    - cron: '53 22,23 * * *'   # las 00:53
    - cron: '43 23,0 * * *'    # la 01:43
    - cron: '7 10,11 * * *'    # las 12:07
    - cron: '53 10,11 * * *'   # las 12:53

  # Este botón permite lanzarlo a mano desde la pestaña Actions de GitHub.
  workflow_dispatch:
    inputs:
      modo:
        description: 'Qué hacer'
        required: true
        default: 'normal'
        type: choice
        options:
          - normal   # comportamiento de siempre
          - seco     # mira las webs y enseña qué haría, sin publicar nada
          - prueba   # manda un mensaje de mentira para comprobar Telegram
          - estreno  # solo el día que abres el canal: publica el último de cada uno

# Evita que dos ejecuciones se pisen si una tarda mucho.
concurrency:
  group: buscar-podcasts
  cancel-in-progress: false

jobs:
  buscar:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # necesario para guardar estado.json en el repositorio

    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      - name: Preparar Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Instalar lo que necesita el programa
        run: pip install -r requirements.txt

      - name: Comprobar que el bot no está roto
        run: python pruebas.py

      - name: Buscar podcasts
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CANAL: ${{ secrets.TELEGRAM_CANAL }}
          TELEGRAM_CANAL_CHAT: ${{ secrets.TELEGRAM_CANAL_CHAT }}
        run: |
          case "${{ github.event.inputs.modo }}" in
            seco)    python main.py --seco ;;
            prueba)  python main.py --prueba ;;
            estreno) python main.py --estreno ;;
            *)       python main.py ;;
          esac

      - name: Guardar por dónde vamos
        run: |
          if [ -n "$(git status --porcelain estado.json)" ]; then
            git config user.name  "Bot Marciano"
            git config user.email "actions@github.com"
            git add estado.json
            git commit -m "Actualizar episodios ya avisados"
            git push
          else
            echo "Sin cambios en estado.json"
          fi
